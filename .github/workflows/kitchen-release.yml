name: Build & Release Kitchen

on:
  repository_dispatch:
    types: [kitchen_bake]
  push:
    branches:
      - dev
  schedule:
    # Backup sync: periodically check every 15 minutes
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force_release:
        description: "Force release even if commit was already released"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: kitchen-release
  cancel-in-progress: false

jobs:
  check-and-prepare:
    name: Check Dev & Prepare Release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      release_name: ${{ steps.meta.outputs.release_name }}
      changelog: ${{ steps.meta.outputs.changelog }}
      commit_hash: ${{ steps.meta.outputs.commit_hash }}
    steps:
      - name: Checkout source directly from GitLab
        run: |
          git clone --branch dev --single-branch --depth 50 https://gitlab.com/almateraincubator/utilities/blip.git .

      - name: Check if latest commit on GitLab dev already released
        id: check
        run: |
          FULL_SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "Latest GitLab dev commit: $FULL_SHA ($SHORT_SHA)"

          # Check existing releases/tags on GitHub
          TAGS=$(gh release list --limit 100 --json tagName --jq '.[].tagName' || true)
          echo "Existing release tags: $TAGS"

          if echo "$TAGS" | grep -q "${SHORT_SHA}"; then
            echo "Commit $SHORT_SHA is already released."
            if [ "${{ inputs.force_release }}" = "true" ]; then
              echo "Force release is enabled."
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "Skipping release."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "New commit detected. Proceeding with release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Release Metadata & Changelog
        if: steps.check.outputs.should_release == 'true'
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          FULL_SHA=$(git rev-parse HEAD)
          DATE_STR=$(date -u +"%Y%m%d-%H%M%S")
          TAG_NAME="build-${DATE_STR}-${SHORT_SHA}"
          RELEASE_NAME="Build ${DATE_STR} (${SHORT_SHA})"

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "commit_hash=${FULL_SHA}" >> "$GITHUB_OUTPUT"

          # Extract Cargo version from GitLab dev
          CARGO_VERSION=$(grep -m1 '^version =' Cargo.toml | cut -d '"' -f 2 || echo "dev")

          # Generate changelog from recent commits
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "## 📦 Blip Release (\`v${CARGO_VERSION}\` - \`${SHORT_SHA}\`)" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "- **Source Repository:** [GitLab \`dev\`](https://gitlab.com/almateraincubator/utilities/blip/-/tree/dev)" >> "$GITHUB_OUTPUT"
          echo "- **Commit:** [${FULL_SHA}](https://gitlab.com/almateraincubator/utilities/blip/-/commit/${FULL_SHA})" >> "$GITHUB_OUTPUT"
          echo "- **Build Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "### 📝 Recent Changes on \`dev\`" >> "$GITHUB_OUTPUT"
          git log -n 15 --pretty=format:"* %h - %s (%an)" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  build-and-package:
    name: Build (${{ matrix.target }})
    needs: check-and-prepare
    if: needs.check-and-prepare.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux GNU Targets (using cross)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            use_cross: true
          # Linux musl Targets (Static)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: armv7-unknown-linux-musleabihf
            os: ubuntu-latest
            use_cross: true
          - target: riscv64gc-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          # macOS
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false

    steps:
      - name: Clone exact release commit directly from GitLab
        run: |
          git clone --branch dev --single-branch https://gitlab.com/almateraincubator/utilities/blip.git .
          git checkout ${{ needs.check-and-prepare.outputs.commit_hash }}

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross binary
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Binary (Native)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Build Binary (Cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }} --locked

      - name: Archive and Checksum Artifacts
        id: package
        shell: bash
        run: |
          BIN_NAME="blip"
          PKG_NAME="blip-${{ matrix.target }}"

          mkdir -p "pkg/${PKG_NAME}"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "pkg/${PKG_NAME}/"
          cp README.md LICENSE "pkg/${PKG_NAME}/" 2>/dev/null || true

          cd pkg
          tar -czvf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            pkg/*.tar.gz
            pkg/*.sha256

  publish-release:
    name: Publish GitHub Release
    needs: [check-and-prepare, build-and-package]
    if: needs.check-and-prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          pattern: artifacts-*
          merge-multiple: true

      - name: Create Checksums File
        run: |
          mkdir -p release-assets
          mv downloaded-artifacts/* release-assets/
          cd release-assets
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256
          ls -la

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.check-and-prepare.outputs.tag_name }}
          RELEASE_NAME: ${{ needs.check-and-prepare.outputs.release_name }}
          CHANGELOG: ${{ needs.check-and-prepare.outputs.changelog }}
        run: |
          echo "$CHANGELOG" > release_notes.md
          gh release create "$TAG_NAME" release-assets/* \
            --repo "${{ github.repository }}" \
            --target kitchen \
            --title "$RELEASE_NAME" \
            --notes-file release_notes.md \
            --latest

  publish-crates:
    name: Publish to Crates.io
    needs: [check-and-prepare, build-and-package]
    if: needs.check-and-prepare.outputs.should_release == 'true'
    environment: Kitchen
    runs-on: ubuntu-latest
    steps:
      - name: Clone exact release commit from GitLab
        run: |
          git clone --branch dev --single-branch https://gitlab.com/almateraincubator/utilities/blip.git .
          git checkout ${{ needs.check-and-prepare.outputs.commit_hash }}

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to Crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            cargo publish --token "$CARGO_REGISTRY_TOKEN" || echo "Version already published on crates.io."
          else
            echo "CARGO_REGISTRY_TOKEN secret is not set in Kitchen environment."
          fi
