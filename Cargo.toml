[package]
name = "bliper"
version = "0.2.1"
edition = "2021"
description = "Minimal Webhook Delivery Bridge"
license-file = "LICENSE"
repository = "https://gitlab.com/almateraincubator/utilities/blip"
readme = "README.md"
keywords = ["deployment", "gitlab", "systemd", "webhook"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "blip"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.7"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
hmac = "0.12"
libc = "0.2"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
